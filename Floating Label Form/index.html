<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Floating Labels</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <form>

            <h2>Floating Labels</h2>

            <div class="form-group">
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder=""
                    required
                >

                <label for="username">Username</label>
            </div>


            <div class="form-group">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder=""
                    required
                >

                <label for="password">Password</label>
            </div>


            <div class="form-group">
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder=""
                    required
                >

                <label for="email">Email</label>
            </div>


            <button type="submit">
                Submit
            </button>

        </form>

    </div>

</body>

</html>
